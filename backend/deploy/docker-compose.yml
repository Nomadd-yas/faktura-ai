# Фактура AI — бэкенд, первый вариант (область solar).
# Сервисы: api (FastAPI) | ml-mock (заглушка ML-1, POST /ml/extract) | postgres | minio.
# Наружу открыт только api (порт API_PORT). Секреты — в deploy/.env (не в git), создаёт deploy/init-env.sh.
# Подключение настоящего ML-1: FAKTURA_EXTRACT_URL в .env -> адрес сервиса ML-1, сервис ml-mock можно не поднимать.
name: faktura

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faktura
      POSTGRES_DB: faktura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD в .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faktura -d faktura"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: faktura
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?нужен MINIO_PASSWORD в .env}
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  ml-mock:
    build: ..
    image: faktura-backend:latest
    restart: unless-stopped
    command: ["python", "-m", "faktura.ml.mock_server"]
    environment:
      FAKTURA_MOCK_GOLD_DIR: /case/dev_gold
    volumes: ["./case:/case:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: faktura-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      FAKTURA_DB_URL: postgresql+psycopg://faktura:${POSTGRES_PASSWORD}@postgres:5432/faktura
      FAKTURA_STORAGE_BACKEND: s3
      FAKTURA_S3_ENDPOINT: http://minio:9000
      FAKTURA_S3_BUCKET: faktura
      FAKTURA_S3_ACCESS_KEY: faktura
      FAKTURA_S3_SECRET_KEY: ${MINIO_PASSWORD}
      FAKTURA_EXTRACTOR: http
      FAKTURA_EXTRACT_URL: ${FAKTURA_EXTRACT_URL:-http://ml-mock:8081}
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      ml-mock: {condition: service_healthy}
    ports: ["${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
  miniodata: {}
