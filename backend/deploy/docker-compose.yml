# Фактура AI — бэкенд, первый вариант (область solar).
# Сервисы: api (FastAPI) | ml-mock (заглушка ML-1, POST /ml/extract) | postgres.
# PDF и служебные файлы — локальное хранилище api на томе files (MinIO/S3 — позже, если понадобится).
# Наружу ничего не открыто: api слушает 127.0.0.1:API_PORT сервера, доступ — через ssh-туннель (deploy/tunnel.ps1). Секреты — в deploy/.env (не в git), создаёт deploy/init-env.sh.
# Прототип ML-1 вместо мока: блок «ML-1 прототип» в .env (см. init-env.sh) + образ faktura-ml (deploy.sh --ml).
name: faktura

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faktura
      POSTGRES_DB: faktura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD в .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faktura -d faktura"]
      interval: 5s
      timeout: 3s
      retries: 20


  ml-mock:
    build: ..
    image: faktura-backend:latest
    restart: unless-stopped
    command: ["python", "-m", "faktura.ml.mock_server"]
    environment:
      FAKTURA_MOCK_GOLD_DIR: /case/dev_gold
      FAKTURA_RAG_CASE_DIR: /case_rag
    volumes: ["./case:/case:ro", "./case_rag:/case_rag:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Прототип ML-1 (ml/pdf-dataset, Иван): PDF -> glmocr (vLLM GLM-OCR на хосте :8123) -> RouterAI -> 7 таблиц.
  # Временная заплатка до новой версии ML-1. Поднимается только с профилем ml (COMPOSE_PROFILES=ml в .env).
  # Наружу не открыт, авторизации у сервиса нет — только внутренняя сеть compose. Ключ RouterAI — в .env.
  ml:
    image: faktura-ml:latest
    profiles: ["ml"]
    restart: unless-stopped
    environment:
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
      ROUTERAI_MODEL: ${ROUTERAI_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      ROUTERAI_PROVIDER: ${ROUTERAI_PROVIDER:-wafer}
      ML_CONCURRENCY: ${ML_CONCURRENCY:-1}  # = FAKTURA_EXTRACT_CONCURRENCY у api; при полном конфиге glmocr в 4g влезают 2
      # рабочий процесс перезапускается после N статей (память torch/glmocr не возвращается); замена прогревается в паузе
      ML_TASKS_PER_CHILD: ${ML_TASKS_PER_CHILD:-1}
      # источник текста: ocr (все страницы через OCR) | auto (текстовый слой PDF, OCR только где нужно) | pdf
      TEXT_SOURCE: ${TEXT_SOURCE:-ocr}
      # графики RAG: модель со зрением для растровых рисунков (пусто — выкл.), 0 — шаг графиков выключен
      RAG_VISION_MODEL: ${RAG_VISION_MODEL:-}
      RAG_VISION_PROVIDER: ${RAG_VISION_PROVIDER:-}
      RAG_FIGURES: ${RAG_FIGURES:-1}
      RAG_FIGURE_PARTIAL: ${RAG_FIGURE_PARTIAL:-keep}
    command: ["serve"]
    # лимит памяти: при переполнении убивается только ml, а не весь сервер (vLLM, api, postgres)
    mem_limit: 4g
    memswap_limit: 4g
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./ml/glmocr.config.yaml:/app/glmocr.config.yaml:ro
      - ml-out:/out
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  api:
    image: faktura-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      FAKTURA_DB_URL: postgresql+psycopg://faktura:${POSTGRES_PASSWORD}@postgres:5432/faktura
      FAKTURA_STORAGE_BACKEND: local
      FAKTURA_STORAGE_DIR: /app/var/storage
      FAKTURA_CACHE_DIR: /app/var/cache
      FAKTURA_EXTRACTOR: http
      FAKTURA_EXTRACT_URL: ${FAKTURA_EXTRACT_URL:-http://ml-mock:8081}
      FAKTURA_CHECK_SCRIPT: /case/tools/check_submission.py  # ?check=true у submission.zip
      FAKTURA_RAG_CASE_DIR: /case_rag  # RAG: tools/check_submission.py + submission_template + dev_gold
    depends_on:
      postgres: {condition: service_healthy}
      ml-mock: {condition: service_healthy}
    volumes: ["files:/app/var", "./case:/case:ro", "./case_rag:/case_rag:ro"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]  # только localhost сервера: доступ через ssh-туннель
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
  files: {}
  ml-out: {}
