# Фактура AI: фронтенд (статика /var/www/faktura) + API бэкенда на 127.0.0.1:8000 (docker compose, только localhost)
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name factura.t1nnld.com;

    ssl_certificate /etc/letsencrypt/live/factura.t1nnld.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/factura.t1nnld.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/faktura;
    index index.html;

    # загрузка папки PDF / ZIP в разбор
    client_max_body_size 1024m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/runs/{id}/events, ответы чата) и большие загрузки: без буферизации, долгие таймауты
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # файлы сборки с хешем в имени - кэш надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (vue-router, history): любой путь -> index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name factura.t1nnld.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
