services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: faktura
      POSTGRES_PASSWORD: faktura
      POSTGRES_DB: faktura
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  ml-mock:
    build: .
    command: ["python", "-m", "faktura.ml.mock_server"]
    environment:
      FAKTURA_CASE_DIR: /case
    volumes: ["../data/caseB_kejs5:/case:ro"]
    ports: ["8081:8081"]
  api:
    build: .
    env_file: .env
    environment:
      FAKTURA_DB_URL: postgresql+psycopg://faktura:faktura@postgres:5432/faktura
      FAKTURA_STORAGE_BACKEND: s3
      FAKTURA_S3_ENDPOINT: http://minio:9000
      FAKTURA_S3_BUCKET: faktura
      FAKTURA_S3_ACCESS_KEY: minioadmin
      FAKTURA_S3_SECRET_KEY: minioadmin
      FAKTURA_EXTRACTOR: http
      FAKTURA_EXTRACT_URL: http://ml-mock:8081
    depends_on: [postgres, minio, ml-mock]
    ports: ["8000:8000"]
volumes:
  pgdata: {}
  miniodata: {}
